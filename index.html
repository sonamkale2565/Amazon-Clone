<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone | Sonam Kale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">amazon<span>clone</span></div>

    <div class="search">
        <input type="text" placeholder="Search products">
        <button>Search</button>
    </div>

    <div class="cart">
        🛒 Cart (<span id="cart-count">0</span>)
    </div>
</header>


<section class="banner">
    <h1>Welcome to Amazon Clone</h1>
    <p>Frontend practice project using HTML, CSS & JavaScript</p>
</section>


<section class="products">

    <div class="card">
        <img src="images/product1.jpg" alt="Product">
        <h3>Wireless Headphones</h3>
        <p>Price: $50</p>
        <button onclick="addCart()">Add to Cart</button>
    </div>


    <div class="card">
        <img src="images/product2.jpg" alt="Product">
        <h3>Smart Watch</h3>
        <p>Price: $70</p>
        <button onclick="addCart()">Add to Cart</button>
    </div>


    <div class="card">
        <img src="images/product3.jpg" alt="Product">
        <h3>Laptop</h3>
        <p>Price: $500</p>
        <button onclick="addCart()">Add to Cart</button>
    </div>

</section>


<footer>
    <p>© 2026 Sonam Kale | Amazon Clone Demo Project</p>
</footer>


<script src="script.js"></script>

</body>
</html>
