<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone | Sonam Kale</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">amazon<span>clone</span></div>

    <div class="search">
        <input type="text" placeholder="Search Amazon Clone">
        <button>Search</button>
    </div>

    <div class="nav">
        <p>Hello, Sign in</p>
        <p>Cart 🛒</p>
    </div>
</header>


<section class="banner">
    <h1>Welcome to Amazon Clone</h1>
    <p>HTML & CSS Frontend Practice Project</p>
</section>


<h2>Featured Products</h2>

<section class="products">

    <div class="card">
        <img src="images/product1.webp" alt="Product 1">
        <h3>Wireless Headphones</h3>
        <p>$50</p>
        <button>Add to Cart</button>
    </div>


    <div class="card">
        <img src="images/product2.webp" alt="Product 2">
        <h3>Smart Watch</h3>
        <p>$70</p>
        <button>Add to Cart</button>
    </div>


    <div class="card">
        <img src="images/product5.webp" alt="Product 3">
        <h3>Laptop</h3>
        <p>$500</p>
        <button>Add to Cart</button>
    </div>

</section>


<footer>
    <p>© 2026 Sonam Kale | Amazon Clone Demo Project</p>
</footer>


</body>
</html>
